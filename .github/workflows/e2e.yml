# Load Testing Pipeline for Smart Class Pulse
name: Load Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: Install dependencies
        run: |
          cd web-app
          npm ci || npm install --no-audit --no-fund

      - name: Run Load Tests
        run: |
          cd web-app
          npm run test:load
