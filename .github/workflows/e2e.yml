name: E2E Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: Install dependencies
        run: |
          cd web-app
          npm ci

      - name: Create .env file
        run: |
          cat <<EOF > web-app/.env
          VITE_APP_ID=com.smartclasspulse.app
          VITE_FUNCTIONS_VERSION=v1
          VITE_APP_BASE_URL=https://app-084e0d55.web.app
          VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY || 'AIzaSyC7oBV3zAwpIv_wM66OK9fE7PC0I9LKN_k' }}
          VITE_GEMINI_MODEL=gemini-1.5-pro
          EOF

      - name: Start Vite development server
        run: |
          cd web-app
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 60000

      - name: Run E2E Tests
        run: |
          cd web-app
          npm run test:e2e

      - name: Upload Test Report (Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: web-app/test-results.xlsx
          if-no-files-found: warn
