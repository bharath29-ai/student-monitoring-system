# Load Testing Pipeline for Smart Class Pulse
name: Load Testing Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'web-app/package-lock.json'

      - name: Install dependencies
        run: |
          cd web-app
          npm ci || npm install --no-audit --no-fund

      - name: Run Load Tests
        run: |
          cd web-app
          # Use npx to ensure artillery is used from node_modules
          # Use || true to ensure the report converter runs even if artillery reports errors
          npx artillery run tests/load-test.yml --output load-report.json || true
          node tests/loadReportConverter.cjs
          ls -lh load-test-results.xlsx || echo "Excel report not found"

      - name: Upload Load Test Report (Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: web-app/load-test-results.xlsx
          if-no-files-found: warn

